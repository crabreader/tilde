      --color-accent: #00f;

    ['a/deepseek', { name: 'DeepSeek', url: 'https://chat.deepseek.com', category: 'ai', parent: 'a', lastUsed: null, useCount: 0 }],

    ['t/nyaa', { name: 'Nyaa', url: 'https://nyaa.si', category: 'torrents', parent: 't', lastUsed: null, useCount: 0 }],

  // Load custom commands from localStorage
  const loadCustomCommands = () => {
    const customCommands = localStorage.getItem('customCommands');
    if (customCommands) {
      const commands = JSON.parse(customCommands);
      for (const [key, command] of Object.entries(commands)) {
        COMMANDS.set(key, command);
      }
    }
  };

  const saveCustomCommands = () => {
    const customCommands = {};
    for (const [key, command] of COMMANDS.entries()) {
      if (command.custom) {
        customCommands[key] = command;
      }
    }
    localStorage.setItem('customCommands', JSON.stringify(customCommands));
  };

  loadCustomCommands();

<template id="commands-template">
  <style>

      align-items: center;
      gap: 4px;

      background: var(--color-text-subtle);
      padding: 1px;
    }

    .command {
      background: var(--color-background);
      padding: 12px;
      text-decoration: none;
      color: var(--color-text);
      display: grid;
      grid-template-areas: 
        "key url"
        "name name"
        "meta meta";
      gap: 4px;
      position: relative;
      outline: none;
      border: 2px solid transparent;
    }

    .command:hover {
      background: var(--color-hover);
      border-color: var(--color-accent);
    }

    .command:focus {
      border-color: var(--color-accent);
      background: var(--color-hover);
    }

    .command.edit-mode {
      border-color: var(--color-warning);
    }

    .command-key {
      grid-area: key;
      font-size: 18px;
      font-weight: bold;
      color: var(--color-accent);
      font-family: monospace;
    }

    .command-url {
      grid-area: url;
      font-size: 9px;
      color: var(--color-text-subtle);
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: monospace;
    }

    .command-name {
      grid-area: name;
      font-size: 14px;
      margin-top: 4px;

      gap: 2px;

      left: 0;
      right: 0;

<script type="module">
  // Commands Component with full state exposure
  class Commands extends HTMLElement {
    #updateInterval;
    #sessionStart;
    #editMode = false;

    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      const template = document.getElementById('commands-template');
      const clone = template.content.cloneNode(true);

      this.#sessionStart = Date.now();
      this.#renderCommands(clone);
      this.#setupStatusBar(clone);
      this.#setupPanels(clone);
      this.#setupControls(clone);

      this.shadowRoot.append(clone);
      this.#startUpdateLoop();
    }

    #renderCommands(root) {
      const container = root.querySelector('.categories');
      container.innerHTML = '';
      const categories = new Map();

      // Group commands by category, excluding subcommands that have parents
      for (const [key, command] of COMMANDS.entries()) {
        if (!command.name || !command.url) continue;

        // Skip subcommands - they'll be shown under their parent
        if (command.parent && COMMANDS.has(command.parent)) continue;

        const category = command.category || 'uncategorized';
        if (!categories.has(category)) {
          categories.set(category, []);
        }
        categories.get(category).push({ key, ...command });
      }

      // Render each category in its own grid cell
      for (const [category, commands] of categories) {
        const section = document.createElement('div');
        section.className = 'category-section';

        // Count all commands including subcommands
        let totalCount = commands.length;
        commands.forEach(cmd => {
          if (cmd.suggestions) {
            totalCount += cmd.suggestions.filter(s => COMMANDS.has(s)).length;
          }
        });

        const header = document.createElement('div');
        header.className = 'category-header';
        header.innerHTML = `
          <span>${category}</span>
          <span class="category-count">${totalCount}</span>
        `;

        const grid = document.createElement('div');
        grid.className = 'command-grid';

        // Render parent commands and their subcommands
        for (const command of commands) {
          // Render parent command
          this.#renderCommand(grid, command);

          // Render subcommands if they exist
          if (command.suggestions) {
            command.suggestions.forEach(subKey => {
              if (COMMANDS.has(subKey)) {
                const subCommand = { key: subKey, ...COMMANDS.get(subKey) };
                this.#renderCommand(grid, subCommand);
              }
            });
          }
        }

        section.appendChild(header);
        section.appendChild(grid);
        container.appendChild(section);
      }
    }

    #renderCommand(grid, command) {
      const link = document.createElement('a');
      link.className = 'command';
      link.href = command.url;
      // Removed: if (CONFIG.openLinksInNewTab) link.target = '_blank';
      // Links will now open in the same tab
      link.rel = 'noopener noreferrer';
      link.dataset.key = command.key;

      // Calculate usage percentage for visual indicator
      const maxUsage = Math.max(...Array.from(COMMANDS.values()).map(c => c.useCount || 0));
      const usagePercent = maxUsage > 0 ? (command.useCount / maxUsage) * 100 : 0;

      link.innerHTML = `
        <span class="command-key">[${command.key}]</span>
        <span class="command-url">${new URL(command.url).hostname}</span>
        <span class="command-name">${command.name}</span>
        <div class="command-meta">
          <span class="meta-item">
            <span class="meta-label">Uses:</span>
            <span>${command.useCount || 0}</span>
          </span>
          <span class="meta-item">
            <span class="meta-label">Last:</span>
            <span>${command.lastUsed ? this.#formatTime(command.lastUsed) : 'Never'}</span>
          </span>
        </div>
        <div class="usage-indicator" style="transform: scaleX(${usagePercent / 100})"></div>
        <div class="command-actions">
          <button class="action-button edit" data-key="${command.key}">EDIT</button>
          <button class="action-button delete" data-key="${command.key}">DEL</button>
        </div>
      `;

      link.addEventListener('click', (e) => {
        if (!this.#editMode) {
          this.#trackUsage(command.key);
        } else {
          e.preventDefault();
        }
      });

      // Setup action buttons
      const editBtn = link.querySelector('.action-button.edit');
      const deleteBtn = link.querySelector('.action-button.delete');

      editBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        this.#editCommand(command.key);
      });

      deleteBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        this.#deleteCommand(command.key);
      });

      grid.appendChild(link);
    }


    #setupStatusBar(root) {
      this.sessionTimeEl = root.querySelector('.session-time');
      this.commandCountEl = root.querySelector('.command-count');
      this.execCountEl = root.querySelector('.exec-count');
      this.networkStatusEl = root.querySelector('.network-status');
      this.modeIndicatorEl = root.querySelector('.mode-indicator');
    }

    #setupPanels(root) {
      this.helpPanel = root.querySelector('.help-panel');
      this.debugPanel = root.querySelector('.debug-panel');

      // Setup debug elements
      if (this.debugPanel) {
        this.debugKeyBuffer = this.debugPanel.querySelector('.key-buffer');
        this.debugLastKey = this.debugPanel.querySelector('.last-key');
        this.debugFocusState = this.debugPanel.querySelector('.focus-state');
        this.debugMemoryUsage = this.debugPanel.querySelector('.memory-usage');
        this.debugCommandTotal = this.debugPanel.querySelector('.command-total');
        this.debugCustomCommands = this.debugPanel.querySelector('.custom-commands');
      }

      // Load saved panel states
      if (CONFIG.showHelp) this.helpPanel.style.display = 'block';
      if (CONFIG.showDebug) this.debugPanel.style.display = 'block';

      // Setup close buttons
      const helpClose = this.helpPanel.querySelector('.close-button');
      const debugClose = this.debugPanel.querySelector('.close-button');

      helpClose.addEventListener('click', () => this.#toggleHelp());
      debugClose.addEventListener('click', () => this.#toggleDebug());
    }

    #setupControls(root) {
      this.toggleHelpBtn = root.querySelector('.toggle-help');
      this.toggleDebugBtn = root.querySelector('.toggle-debug');
      this.toggleEditBtn = root.querySelector('.toggle-edit');
      this.addCommandBtn = root.querySelector('.add-command-button');

      this.toggleHelpBtn.addEventListener('click', () => this.#toggleHelp());
      this.toggleDebugBtn.addEventListener('click', () => this.#toggleDebug());
      this.toggleEditBtn.addEventListener('click', () => this.#toggleEditMode());
      this.addCommandBtn.addEventListener('click', () => this.#addCommand());

      // Update button states
      if (CONFIG.showHelp) this.toggleHelpBtn.classList.add('active');
      if (CONFIG.showDebug) this.toggleDebugBtn.classList.add('active');
    }

    #toggleHelp() {
      CONFIG.showHelp = !CONFIG.showHelp;
      this.helpPanel.style.display = CONFIG.showHelp ? 'block' : 'none';
      this.toggleHelpBtn.classList.toggle('active', CONFIG.showHelp);
      this.#saveConfig();
    }

    #toggleDebug() {
      CONFIG.showDebug = !CONFIG.showDebug;
      this.debugPanel.style.display = CONFIG.showDebug ? 'block' : 'none';
      this.toggleDebugBtn.classList.toggle('active', CONFIG.showDebug);
      this.#saveConfig();
    }

    #toggleEditMode() {
      this.#editMode = !this.#editMode;
      STATE.editMode = this.#editMode;
      this.toggleEditBtn.classList.toggle('active', this.#editMode);
      this.addCommandBtn.style.display = this.#editMode ? 'block' : 'none';

      // Update all command elements
      const commands = this.shadowRoot.querySelectorAll('.command');
      commands.forEach(cmd => {
        cmd.classList.toggle('edit-mode', this.#editMode);
      });
    }

    #addCommand() {
      this.#showEditor();
    }

    #editCommand(key) {
      const command = COMMANDS.get(key);
      this.#showEditor(key, command);
    }

    #deleteCommand(key) {
      if (confirm(`Delete command "${key}"?`)) {
        const command = COMMANDS.get(key);

        // If this is a parent command, also delete its subcommands
        if (command.suggestions) {
          command.suggestions.forEach(subKey => {
            if (COMMANDS.has(subKey) && COMMANDS.get(subKey).custom) {
              COMMANDS.delete(subKey);
            }
          });
        }

        // If this is a subcommand, remove it from parent's suggestions
        if (key.includes('/')) {
          const parentKey = key.split('/')[0];
          if (COMMANDS.has(parentKey)) {
            const parent = COMMANDS.get(parentKey);
            if (parent.suggestions) {
              parent.suggestions = parent.suggestions.filter(s => s !== key);
            }
          }
        }

        COMMANDS.delete(key);
        saveCustomCommands();
        this.#renderCommands(this.shadowRoot);
      }
    }


    #showEditor(key = '', command = {}) {
      const template = document.getElementById('command-editor-template');
      const clone = template.content.cloneNode(true);

      const form = clone.querySelector('.editor-form');
      const overlay = clone.querySelector('.editor-overlay');

      // Populate form if editing
      if (key) {
        form.key.value = key;
        form.key.disabled = !command.custom; // Can't change key of non-custom commands
        form.name.value = command.name || '';
        form.url.value = command.url || '';
        form.category.value = command.category || '';
        form.searchTemplate.value = command.searchTemplate || '';
        form.suggestions.value = (command.suggestions || []).join(',');
      }

      // Setup event handlers
      const cancelBtn = clone.querySelector('.cancel');
      cancelBtn.addEventListener('click', () => {
        overlay.remove();
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const newKey = form.key.value.trim();
        const commandData = {
          name: form.name.value.trim(),
          url: form.url.value.trim(),
          category: form.category.value.trim(),
          custom: true,
          lastUsed: command.lastUsed || null,
          useCount: command.useCount || 0
        };

        // Determine if this is a parent or child command
        if (newKey.includes('/')) {
          const parentKey = newKey.split('/')[0];
          commandData.parent = parentKey;

          // Add this subcommand to parent's suggestions if parent exists
          if (COMMANDS.has(parentKey)) {
            const parent = COMMANDS.get(parentKey);
            if (!parent.suggestions) parent.suggestions = [];
            if (!parent.suggestions.includes(newKey)) {
              parent.suggestions.push(newKey);
            }
          }
        } else {
          // This is a parent command, set accessKey
          commandData.accessKey = newKey;
        }

        if (form.searchTemplate.value.trim()) {
          commandData.searchTemplate = form.searchTemplate.value.trim();
        }

        if (form.suggestions.value.trim()) {
          const suggestions = form.suggestions.value.split(',').map(s => s.trim());
          commandData.suggestions = suggestions;

          // Create subcommand entries for each suggestion
          suggestions.forEach(subKey => {
            if (!COMMANDS.has(subKey)) {
              // Auto-create subcommand with basic info
              COMMANDS.set(subKey, {
                name: subKey.split('/').pop(), // Use last part as name
                url: commandData.url, // Inherit parent URL
                category: commandData.category,
                parent: newKey,
                custom: true,
                lastUsed: null,
                useCount: 0
              });
            }
          });
        }

        // Remove old key if changed
        if (key && key !== newKey) {
          COMMANDS.delete(key);

          // Update parent suggestions if this was a subcommand
          if (key.includes('/')) {
            const oldParentKey = key.split('/')[0];
            if (COMMANDS.has(oldParentKey)) {
              const oldParent = COMMANDS.get(oldParentKey);
              if (oldParent.suggestions) {
                oldParent.suggestions = oldParent.suggestions.filter(s => s !== key);
              }
            }
          }
        }

        COMMANDS.set(newKey, commandData);
        saveCustomCommands();
        this.#renderCommands(this.shadowRoot);
        overlay.remove();
      });

      document.body.appendChild(clone);
    }


    #saveConfig() {
      localStorage.setItem('startpageConfig', JSON.stringify(CONFIG));
    }

    #startUpdateLoop() {
      this.#updateInterval = setInterval(() => {
        this.#updateStatus();
      }, 100);
    }

    #updateStatus() {
      // Update session time
      const elapsed = Date.now() - this.#sessionStart;
      const hours = Math.floor(elapsed / 3600000);
      const minutes = Math.floor((elapsed % 3600000) / 60000);
      const seconds = Math.floor((elapsed % 60000) / 1000);
      this.sessionTimeEl.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

      // Update command count
      this.commandCountEl.textContent = COMMANDS.size;

      // Update executed count
      this.execCountEl.textContent = STATE.commandsExecuted;

      // Update network status
      this.networkStatusEl.textContent = `${STATE.networkLatency}ms`;

      // Update mode indicator
      let mode = 'BROWSE';
      if (STATE.searchActive) mode = 'SEARCH';
      if (STATE.editMode) mode = 'EDIT';
      this.modeIndicatorEl.textContent = mode;

      // Update debug info if enabled
      if (CONFIG.showDebug && this.debugPanel) {
        this.debugKeyBuffer.textContent = `Buffer: ${STATE.keyBuffer}`;
        this.debugLastKey.textContent = `Last Key: ${STATE.lastKeyPress || 'None'}`;
        this.debugFocusState.textContent = `Focus: ${STATE.focusedElement || 'body'}`;

        if (performance.memory) {
          const memUsage = (performance.memory.usedJSHeapSize / 1048576).toFixed(1);
          this.debugMemoryUsage.textContent = `Memory: ${memUsage}MB`;
        }

        this.debugCommandTotal.textContent = `Total Cmds: ${COMMANDS.size}`;
        const customCount = Array.from(COMMANDS.values()).filter(c => c.custom).length;
        this.debugCustomCommands.textContent = `Custom: ${customCount}`;
      }
    }

    #trackUsage(key) {
      const command = COMMANDS.get(key);
      if (command) {
        command.useCount = (command.useCount || 0) + 1;
        command.lastUsed = Date.now();
        STATE.commandsExecuted++;
        localStorage.setItem(`cmd_${key}_usage`, JSON.stringify({
          count: command.useCount,
          lastUsed: command.lastUsed
        }));
      }
    }

    #formatTime(timestamp) {
      const diff = Date.now() - timestamp;
      if (diff < 60000) return 'Just now';
      if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
      if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
      return `${Math.floor(diff / 86400000)}d ago`;
    }

    disconnectedCallback() {
      clearInterval(this.#updateInterval);
    }
  }

  // Search Component with Kagi integration
  class Search extends HTMLElement {
    #dialog;
    #form;
    #input;
    #suggestions;
    #historyList;
    #parseStartTime;

    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      const template = document.getElementById('search-template');
      const clone = template.content.cloneNode(true);

      this.#dialog = clone.querySelector('.dialog');
      this.#form = clone.querySelector('.form');
      this.#input = clone.querySelector('.input');
      this.#suggestions = clone.querySelector('.suggestions');
      this.#historyList = clone.querySelector('.history-list');

      this.#setupEventListeners();
      this.#setupStatusElements(clone);
      this.#loadHistory();
      this.#startTimeUpdate(clone);

      this.shadowRoot.append(clone);
    }

    #setupEventListeners() {
      this.#form.addEventListener('submit', this.#onSubmit, false);
      this.#input.addEventListener('input', this.#onInput);
      this.#suggestions.addEventListener('click', this.#onSuggestionClick);
      document.addEventListener('keydown', this.#onKeydown);

      // Track focus state
      this.#input.addEventListener('focus', () => {
        STATE.focusedElement = 'search-input';
      });

      this.#input.addEventListener('blur', () => {
        STATE.focusedElement = null;
      });
    }

    #setupStatusElements(root) {
      this.queryLengthEl = root.querySelector('.query-length');
      this.parseTimeEl = root.querySelector('.parse-time');
      this.suggestionCountEl = root.querySelector('.suggestion-count');
      this.suggestionSourceEl = root.querySelector('.suggestion-source');
      this.inputStatusEl = root.querySelector('.input-status');
      this.suggestionStatsEl = root.querySelector('.suggestion-stats');
      this.historyCountEl = root.querySelector('.history-count');
      this.loadingIndicatorEl = root.querySelector('.loading-indicator');
      this.currentTimeEl = root.querySelector('.current-time');
    }

    #startTimeUpdate(root) {
      setInterval(() => {
        const now = new Date();
        this.currentTimeEl.textContent = now.toLocaleTimeString('en-US', { hour12: false });
      }, 1000);
    }

    #loadHistory() {
      const history = JSON.parse(localStorage.getItem('searchHistory') || '[]');
      STATE.searchHistory = history.slice(0, CONFIG.maxHistoryItems);
      this.#renderHistory();
    }

    #renderHistory() {
      this.#historyList.innerHTML = '';
      this.historyCountEl.textContent = STATE.searchHistory.length;

      for (const item of STATE.searchHistory.slice(0, 10)) {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <span>${item.query}</span>
          <span class="history-time">${this.#formatRelativeTime(item.timestamp)}</span>
        `;
        div.addEventListener('click', () => {
          this.#input.value = item.query;
          this.#onInput();
        });
        this.#historyList.appendChild(div);
      }
    }

    static #escapeRegexCharacters(s) {
      return s.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
    }

    // Modified to use Kagi's autosuggest API if API key is provided
    static async #fetchKagiSuggestions(search) {
      const startTime = performance.now();
      STATE.suggestionsLoading = true;

      // If no API key, fall back to DuckDuckGo for suggestions
      if (!CONFIG.kagiApiKey) {
        return Search.#fetchDuckDuckGoSuggestions(search);
      }

      try {
        // Kagi Autosuggest API endpoint
        const response = await fetch(`https://kagi.com/api/autosuggest?q=${encodeURIComponent(search)}`, {
          headers: {
            'Authorization': `Bot ${CONFIG.kagiApiKey}`
          }
        });

        if (!response.ok) {
          // Fall back to DuckDuckGo if Kagi API fails
          return Search.#fetchDuckDuckGoSuggestions(search);
        }

        const data = await response.json();
        STATE.networkLatency = Math.round(performance.now() - startTime);
        STATE.suggestionsLoading = false;

        return data.completions || [];
      } catch (error) {
        console.error('Kagi API error:', error);
        // Fall back to DuckDuckGo
        return Search.#fetchDuckDuckGoSuggestions(search);
      }
    }

    // Keep DuckDuckGo as fallback
    static async #fetchDuckDuckGoSuggestions(search) {
      const startTime = performance.now();
      STATE.suggestionsLoading = true;

      return new Promise((resolve) => {
        window.autocompleteCallback = (res) => {
          STATE.networkLatency = Math.round(performance.now() - startTime);
          STATE.suggestionsLoading = false;

          const suggestions = [];
          for (const item of res) {
            if (item.phrase === search.toLowerCase()) continue;
            suggestions.push(item.phrase);
          }
          resolve(suggestions);
        };

        const script = document.createElement('script');
        document.querySelector('head').appendChild(script);
        script.src = `https://duckduckgo.com/ac/?callback=autocompleteCallback&q=${search}`;
        script.onload = script.remove;
      });
    }

    static #formatSearchUrl(template, search) {
      return template.replace(/{}/g, encodeURIComponent(search));
    }

    static #hasProtocol(s) {
      return /^[a-zA-Z]+:\/\//i.test(s);
    }

    static #isUrl(s) {
      return /^((https?:\/\/)?[\w-]+(\.[\w-]+)+\.?(:\d+)?(\/\S*)?)$/i.test(s);
    }

    static #parseQuery = (raw) => {
      const startTime = performance.now();
      const query = raw.trim();

      const result = (() => {
        if (this.#isUrl(query)) {
          const url = this.#hasProtocol(query) ? query : `https://${query}`;
          return { query, url, type: 'url' };
        }

        if (COMMANDS.has(query)) {
          const command = COMMANDS.get(query);
          return { key: query, query, url: command.url, type: 'command' };
        }

        let splitBy = CONFIG.commandSearchDelimiter;
        const [searchKey, rawSearch] = query.split(new RegExp(`${splitBy}(.*)`));

        if (COMMANDS.has(searchKey)) {
          const command = COMMANDS.get(searchKey);
          const template = new URL(command.searchTemplate ?? '', command.url);
          const search = rawSearch?.trim() || '';
          const url = Search.#formatSearchUrl(decodeURI(template.href), search);
          return { key: searchKey, query, search, splitBy, url, type: 'command-search' };
        }

        splitBy = CONFIG.commandPathDelimiter;
        const [pathKey, path] = query.split(new RegExp(`${splitBy}(.*)`));

        if (COMMANDS.has(pathKey)) {
          const command = COMMANDS.get(pathKey);
          const url = `${new URL(command.url).origin}/${path || ''}`;
          return { key: pathKey, path, query, splitBy, url, type: 'command-path' };
        }

        const url = Search.#formatSearchUrl(CONFIG.defaultSearchTemplate, query);
        return { query, search: query, url, type: 'search' };
      })();

      result.parseTime = performance.now() - startTime;
      return result;
    };

    #close() {
      STATE.searchActive = false;
      STATE.currentQuery = '';
      STATE.keyBuffer = '';
      this.#input.value = '';
      this.#input.blur();
      this.#dialog.close();
      this.#suggestions.innerHTML = '';
      this.loadingIndicatorEl.style.display = 'none';
    }

    #execute(query) {
      const parsed = Search.#parseQuery(query);
      const target = CONFIG.openLinksInNewTab ? '_blank' : '_self';

      // Track command usage
      if (parsed.key && COMMANDS.has(parsed.key)) {
        const command = COMMANDS.get(parsed.key);
        command.useCount = (command.useCount || 0) + 1;
        command.lastUsed = Date.now();
        STATE.commandsExecuted++;
      }

      // Save to history
      STATE.searchHistory.unshift({
        query,
        timestamp: Date.now(),
        type: parsed.type
      });
      STATE.searchHistory = STATE.searchHistory.slice(0, CONFIG.maxHistoryItems);
      localStorage.setItem('searchHistory', JSON.stringify(STATE.searchHistory));

      window.open(parsed.url, target, 'noopener noreferrer');
      this.#close();
    }

    #focusNextSuggestion(previous = false) {
      const active = this.shadowRoot.activeElement;
      let nextIndex;

      if (active?.dataset?.index) {
        const activeIndex = Number(active.dataset.index);
        nextIndex = previous ? activeIndex - 1 : activeIndex + 1;
      } else {
        nextIndex = previous ? this.#suggestions.childElementCount - 1 : 0;
      }

      const next = this.#suggestions.children[nextIndex];
      if (next) {
        next.querySelector('.suggestion').focus();
        STATE.focusedElement = `suggestion-${nextIndex}`;
      } else {
        this.#input.focus();
        STATE.focusedElement = 'search-input';
      }
    }

    #onInput = async () => {
      this.#parseStartTime = performance.now();
      const oq = Search.#parseQuery(this.#input.value);

      STATE.currentQuery = oq.query;

      // Update status
      this.queryLengthEl.textContent = oq.query.length;
      this.parseTimeEl.textContent = `${oq.parseTime.toFixed(2)}ms`;
      this.inputStatusEl.textContent = oq.type.toUpperCase();

      if (!oq.query) {
        this.#close();
        return;
      }

      let suggestions = [];

      // If it's a command, always show it as the first suggestion
      if (COMMANDS.has(oq.query)) {
        suggestions.push(oq.query);
      }

      // Add command's predefined suggestions
      const commandSuggestions = COMMANDS.get(oq.key || oq.query)?.suggestions || [];
      suggestions = suggestions.concat(commandSuggestions);

      let source = 'LOCAL';

      if (oq.search?.length > 1 && suggestions.length < CONFIG.suggestionLimit) {
        this.loadingIndicatorEl.style.display = 'inline-block';
        this.suggestionSourceEl.textContent = 'LOADING...';

        // Use Kagi suggestions if available, otherwise DuckDuckGo
        const res = await Search.#fetchKagiSuggestions(oq.search);
        source = CONFIG.kagiApiKey ? 'KAGI' : 'DUCKDUCKGO';

        suggestions = suggestions
          .concat(
            oq.splitBy
              ? res.map((search) => `${oq.key}${oq.splitBy}${search}`)
              : res
          )
          .slice(0, CONFIG.suggestionLimit);

        this.loadingIndicatorEl.style.display = 'none';
      }

      const nq = Search.#parseQuery(this.#input.value);
      if (nq.query !== oq.query) return;

      this.suggestionSourceEl.textContent = source;
      this.#renderSuggestions(suggestions, oq.query);
    };

    #onKeydown = (e) => {
      STATE.lastKeyPress = e.key;
      STATE.keyBuffer = (STATE.keyBuffer + e.key).slice(-10);

      // Handle keyboard shortcuts
      if (e.ctrlKey && !e.shiftKey) {
        if (e.key === 'h') {
          e.preventDefault();
          CONFIG.showHelp = !CONFIG.showHelp;
          localStorage.setItem('startpageConfig', JSON.stringify(CONFIG));
          return;
        }
        if (e.key === 'd') {
          e.preventDefault();
          CONFIG.showDebug = !CONFIG.showDebug;
          localStorage.setItem('startpageConfig', JSON.stringify(CONFIG));
          return;
        }
        if (e.key === 'e') {
          e.preventDefault();
          STATE.editMode = !STATE.editMode;
          return;
        }
      }

      if (!this.#dialog.open && !STATE.editMode) {
        STATE.searchActive = true;
        this.#dialog.show();
        this.#input.focus();

        requestAnimationFrame(() => {
          if (!this.#input.value) this.#close();
        });
        return;
      }

      if (e.key === 'Escape') {
        this.#close();
        return;
      }

      const alt = e.altKey ? 'alt-' : '';
      const ctrl = e.ctrlKey ? 'ctrl-' : '';
      const meta = e.metaKey ? 'meta-' : '';
      const shift = e.shiftKey ? 'shift-' : '';
      const modifierPrefixedKey = `${alt}${ctrl}${meta}${shift}${e.key}`;

      if (/^(ArrowDown|Tab|ctrl-n)$/.test(modifierPrefixedKey)) {
        e.preventDefault();
        this.#focusNextSuggestion();
        return;
      }

      if (/^(ArrowUp|ctrl-p|shift-Tab)$/.test(modifierPrefixedKey)) {
        e.preventDefault();
        this.#focusNextSuggestion(true);
      }
    };

    #onSubmit = () => {
      this.#execute(this.#input.value);
    };

    #onSuggestionClick = (e) => {
      const ref = e.target.closest('.suggestion');
      if (!ref) return;
      this.#execute(ref.dataset.suggestion);
    };

    #renderSuggestions(suggestions, query) {
      this.#suggestions.innerHTML = '';
      this.suggestionCountEl.textContent = suggestions.length;
      this.suggestionStatsEl.textContent = `${suggestions.length}/${CONFIG.suggestionLimit}`;

      const template = document.getElementById('suggestion-template');

      for (const [index, suggestion] of suggestions.entries()) {
        const clone = template.content.cloneNode(true);
        const ref = clone.querySelector('.suggestion');
        ref.dataset.index = index;
        ref.dataset.suggestion = suggestion;

        const indexEl = clone.querySelector('.suggestion-index');
        indexEl.textContent = `[${index + 1}]`;

        const keyEl = clone.querySelector('.suggestion-key');
        const nameEl = clone.querySelector('.suggestion-name');
        const urlEl = clone.querySelector('.suggestion-url');
        const metaEl = clone.querySelector('.suggestion-meta');
        const typeEl = clone.querySelector('.suggestion-type');

        // Get command info if this is a command
        const command = COMMANDS.get(suggestion);

        if (command) {
          // This is a command - show full info
          keyEl.textContent = `[${suggestion}]`;
          nameEl.textContent = command.name || suggestion;
          urlEl.textContent = new URL(command.url).hostname;

          // Add metadata
          const metaItems = [];
          if (command.useCount > 0) {
            metaItems.push(`Uses: ${command.useCount}`);
          }
          if (command.category) {
            metaItems.push(`Cat: ${command.category}`);
          }
          if (command.searchTemplate) {
            metaItems.push(`Search: Yes`);
          }
          if (command.custom) {
            metaItems.push(`Custom`);
          }
          metaEl.textContent = metaItems.join(' | ');

          typeEl.textContent = 'COMMAND';
        } else {
          // This is a search suggestion or path
          keyEl.textContent = '';

          // Highlight matching text
          const escapedQuery = Search.#escapeRegexCharacters(query);
          const matched = suggestion.match(new RegExp(escapedQuery, 'i'));

          if (matched) {
            const template = document.getElementById('match-template');
            const clone = template.content.cloneNode(true);
            const matchRef = clone.querySelector('.match');
            const pre = suggestion.slice(0, matched.index);
            const post = suggestion.slice(matched.index + matched[0].length);
            matchRef.innerText = matched[0];
            matchRef.insertAdjacentHTML('beforebegin', pre);
            matchRef.insertAdjacentHTML('afterend', post);
            nameEl.append(clone);
          } else {
            nameEl.innerText = suggestion;
          }

          urlEl.textContent = '';
          metaEl.textContent = '';

          // Determine type
          let type = 'SEARCH';
          if (suggestion.includes('/')) {
            type = 'PATH';
          }
          typeEl.textContent = type;
        }

        this.#suggestions.append(clone);
      }
    }

    #formatRelativeTime(timestamp) {
      const diff = Date.now() - timestamp;
      if (diff < 60000) return 'now';
      if (diff < 3600000) return `${Math.floor(diff / 60000)}m`;
      if (diff < 86400000) return `${Math.floor(diff / 3600000)}h`;
      return `${Math.floor(diff / 86400000)}d`;
    }
  }

  customElements.define('commands-component', Commands);
  customElements.define('search-component', Search);
</script>

<style>
  * {
    box-sizing: border-box;
  }

  html {
    background-color: var(--color-background);
    font-family: var(--font-family);
    font-size: var(--font-size);
    line-height: 1.4;
    cursor: default;
  }

  body {
    margin: 0;
    padding: 0;
  }

  /* Performance optimizations */
  * {
    will-change: auto;
    backface-visibility: hidden;
  }

  /* Debug grid overlay */
  body.debug-grid {
    background-image: 
      repeating-linear-gradient(0deg, rgba(255,0,0,0.1) 0px, transparent 1px, transparent 11px, rgba(255,0,0,0.1) 12px),
      repeating-linear-gradient(90deg, rgba(255,0,0,0.1) 0px, transparent 1px, transparent 11px, rgba(255,0,0,0.1) 12px);
    background-size: 12px 12px;
  }
</style>

<commands-component></commands-component>
<search-component></search-component>

<script>
  // Initialize usage tracking from localStorage
  for (const [key, command] of COMMANDS.entries()) {
    const stored = localStorage.getItem(`cmd_${key}_usage`);
    if (stored) {
      const data = JSON.parse(stored);
      command.useCount = data.count || 0;
      command.lastUsed = data.lastUsed || null;
    }
  }

  // Debug mode toggle
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.shiftKey && e.key === 'D') {
      document.body.classList.toggle('debug-grid');
    }
  });

  // Performance monitoring
  if (window.performance && performance.mark) {
    performance.mark('page-interactive');
    window.addEventListener('load', () => {
      performance.mark('page-complete');
      performance.measure('load-time', 'page-interactive', 'page-complete');
      const measure = performance.getEntriesByName('load-time')[0];
      console.log(`Page load time: ${measure.duration.toFixed(2)}ms`);
    });
  }
</script>
